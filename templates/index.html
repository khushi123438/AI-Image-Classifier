<!DOCTYPE html>
<html>
<head>

<title>CNN Vision AI Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Segoe UI,sans-serif;
}


body{

min-height:100vh;

background:
linear-gradient(135deg,#020617,#0f172a,#111827);

color:white;

overflow-x:hidden;

}



/* glowing background */

body:before{

content:"";

position:absolute;

width:700px;
height:700px;

background:#2563eb;

filter:blur(180px);

opacity:.25;

top:-250px;
left:-200px;

}


body:after{

content:"";

position:absolute;

width:600px;
height:600px;

background:#7c3aed;

filter:blur(180px);

opacity:.2;

right:-200px;
bottom:-200px;

}




.dashboard{


position:relative;

z-index:2;

width:100%;

min-height:100vh;

padding:50px 80px;


}




/* header */


.header{


display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:45px;


}




.brand p{

color:#94a3b8;

font-size:18px;

margin-top:8px;

}



.ai-badge{


padding:12px 25px;

border-radius:30px;

background:
rgba(37,99,235,.2);

border:1px solid #2563eb;


color:#60a5fa;

}




/* main dashboard */


.main{


display:grid;

grid-template-columns:1.4fr 1fr;

gap:35px;


}





.panel{


background:

rgba(15,23,42,.75);


border:

1px solid rgba(255,255,255,.1);


backdrop-filter:blur(20px);


border-radius:30px;


padding:35px;


box-shadow:

0 25px 60px rgba(0,0,0,.4);


}




.panel h2{


font-size:24px;

margin-bottom:25px;


}



/* upload */


.upload{


height:350px;

border:2px dashed #3b82f6;

border-radius:25px;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

cursor:pointer;

transition:.4s;


}



.upload:hover{

background:#111827;

transform:scale(1.02);

}



.upload-icon{


font-size:70px;

margin-bottom:20px;


}



.upload span{


font-size:22px;

color:#60a5fa;


}


input{

display:none;

}





.preview-box{


margin-top:25px;

display:flex;

justify-content:center;


}



.preview{


width:300px;

height:260px;

object-fit:contain;

border-radius:20px;

display:none;


}



/* button */


button{


margin-top:30px;

width:100%;

padding:18px;

border-radius:15px;

border:none;


font-size:20px;

font-weight:700;


background:

linear-gradient(90deg,#2563eb,#9333ea);


color:white;

cursor:pointer;


}



button:hover{

box-shadow:

0 0 35px #2563eb;

}





/* right analytics */


.stats{


display:grid;

grid-template-columns:1fr 1fr;

gap:20px;


}



.stat-card{


padding:25px;

border-radius:20px;

background:#020617;

border:1px solid #1e293b;


}



.stat-card h3{


color:#94a3b8;

font-size:15px;


}



.stat-card p{


font-size:28px;

margin-top:10px;

color:#38bdf8;


}





.result-img{


width:100%;

height:300px;

object-fit:contain;

border-radius:20px;


}




.confidence{


margin-top:35px;


}


.progress{


height:18px;

background:#1e293b;

border-radius:20px;

overflow:hidden;


}



.progress div{


height:100%;

background:

linear-gradient(
90deg,
#22c55e,
#3b82f6
);


}





/* responsive */


@media(max-width:900px){


.dashboard{

padding:25px;

}


.main{

grid-template-columns:1fr;

}


.header{

flex-direction:column;

gap:20px;

}


}



</style>

</head>



<body>



<div class="dashboard">


<div class="header">


<div class="brand">

<h1>
<span>🧠</span> CNN Vision AI
</h1>


<p>
Deep Learning Image Classification Platform
</p>

</div>



<div class="ai-badge">

● AI Model Active

</div>


</div>





<div class="main">





<!-- LEFT -->


<div class="panel">


<h2>
Upload & Analyze Image
</h2>


<form action="/predict"
method="POST"
enctype="multipart/form-data">



<label class="upload"
for="imageInput">


<div class="upload-icon">
📷
</div>


<span>
Choose Image
</span>


<p style="color:#64748b;margin-top:10px">
JPG • PNG • JPEG supported
</p>


<input 
id="imageInput"
type="file"
name="image"
accept="image/*"
required>


</label>



<div class="preview-box">


<img id="preview"
class="preview">

</div>




<button>

🚀 Run CNN Prediction

</button>


</form>



</div>





<!-- RIGHT -->

<div class="panel">


<h2>
AI Analysis Dashboard
</h2>




<div class="stats">


<div class="stat-card">

<h3>
MODEL
</h3>

<p>
CNN
</p>

</div>



<div class="stat-card">

<h3>
STATUS
</h3>

<p>
READY
</p>

</div>



</div>




<br>




{% if img %}


<img src="{{img}}"
class="result-img">



<h2 style="margin-top:25px">

{{prediction}}

</h2>



<div class="confidence">


<p>
Confidence Score
</p>


<div class="progress">


<div style="width:{{confidence}}%">
</div>


</div>


<p style="margin-top:12px">

{{confidence}}% Accuracy

</p>


</div>



{% else %}



<div style="
height:300px;
display:flex;
align-items:center;
justify-content:center;
color:#64748b;
font-size:20px;">


Waiting for image analysis...


</div>



{% endif %}





</div>




</div>


</div>






<script>


const input=document.getElementById("imageInput");

const preview=document.getElementById("preview");



input.addEventListener(
"change",
()=>{


let file=input.files[0];


if(file){


let reader=new FileReader();


reader.onload=e=>{


preview.src=e.target.result;

preview.style.display="block";


}


reader.readAsDataURL(file);


}


}

);



</script>



</body>
</html>
